apiVersion: v1
kind: Namespace
metadata:
  name: rf-sensing-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rf-pose-config
  namespace: rf-sensing-system
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.rf-sensing-system.svc.cluster.local:9092"
  KAFKA_TOPIC: "rf.esp32.csi.raw"
  ENABLE_SIMULATOR: "false"
  NUM_SUBCARRIERS: "64"
  SAMPLING_RATE_HZ: "100.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf-pose-inference-engine
  namespace: rf-sensing-system
  labels:
    app: rf-pose-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rf-pose-inference
  template:
    metadata:
      labels:
        app: rf-pose-inference
    spec:
      containers:
      - name: rf-pose-gpu-worker
        image: rf-pose-inference:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: rf-pose-config
        ports:
        - containerPort: 8000
          name: http-ws
        resources:
          limits:
            cpu: "4000m"
            memory: "8Gi"
            nvidia.com/gpu: 1
          requests:
            cpu: "2000m"
            memory: "4Gi"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rf-pose-service
  namespace: rf-sensing-system
spec:
  type: ClusterIP
  selector:
    app: rf-pose-inference
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    name: http-ws
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rf-pose-ingress
  namespace: rf-sensing-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "rf-pose-service"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rf-pose-service
            port:
              number: 8000
